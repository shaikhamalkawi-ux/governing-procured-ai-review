name: Public research audit
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public metadata
        run: python scripts/audit_release.py
      - name: Test positive and negative assertions
        run: python -m unittest discover -s tests -v
      - name: Reproduce public documentary rule certificates
        run: python data/documentary/replay_public_safe.py
